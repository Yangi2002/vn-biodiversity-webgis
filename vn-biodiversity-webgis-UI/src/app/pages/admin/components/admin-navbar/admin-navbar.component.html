<aside class="admin-sidebar" aria-label="Admin navigation">
  <a class="admin-brand" routerLink="/" aria-label="Về trang chủ VN Biodiversity WebGIS">
    <span class="admin-brand-mark">AD</span>
    <div>
      <strong>VN Biodiversity</strong>
      <small>Administration</small>
    </div>
  </a>

  <p class="nav-section-label">Trang hệ thống</p>

  <nav class="public-nav-links" aria-label="Điều hướng WebGIS">
    @for (item of publicNavItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.route === '/' }">
        {{ item.label }}
      </a>
    }
  </nav>

  <p class="nav-section-label">Quản trị</p>

  <nav class="admin-nav-links" aria-label="Điều hướng quản trị">
    @for (item of navItems; track item.tab) {
      <button type="button" [class.is-active]="activeTab() === item.tab" (click)="selectTab(item.tab)">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-copy">
          <strong>{{ item.label }}</strong>
          <small>{{ item.description }}</small>
        </span>
      </button>
    }
  </nav>

  <a
    class="admin-user-card"
    routerLink="/account"
    [class.is-active]="activeTab() === 'settings'"
    aria-label="Cài đặt thông tin cá nhân"
  >
    <span class="admin-user-avatar" aria-hidden="true">&#128100;</span>
    <div>
      <strong>Cài đặt tài khoản<span class="settings-gear" aria-hidden="true">&#9881;</span></strong>
      <small>{{ currentUser?.displayName || 'Quản trị hệ thống' }}</small>
    </div>
  </a>

  <button type="button" class="admin-logout" (click)="logout()">Đăng xuất</button>
</aside>
