<main class="login-page">
  <section class="login-card">
    <a class="login-brand" routerLink="/">
      <img src="/Header-logo-header.png" width="64" height="64" alt="" />
      <span>
        <strong>VN Biodiversity WebGIS</strong>
        <small>Tài khoản hệ thống</small>
      </span>
    </a>

    <div class="login-copy">
      <p>Đăng nhập</p>
      <h1>Chào mừng trở lại</h1>
      <span>Truy cập hồ sơ cá nhân và các chức năng được cấp theo vai trò.</span>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <label>
        Email
        <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required />
      </label>

      <label>
        Mật khẩu
        <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
      </label>

      @if (errorMessage()) {
        <p class="login-error" role="alert" aria-live="assertive">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="login-register">Chưa có tài khoản? <a routerLink="/register">Đăng ký</a></p>
  </section>
</main>
