[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vn-biodiversity-webgis-ai"
version = "0.1.0"
description = "AI research and training workspace for VN Biodiversity WebGIS"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
biodiversity-ai = "biodiversity_ai.assistant.cli:main"

[project.optional-dependencies]
rag = [
  "accelerate>=1.2,<2",
  "numpy>=2.0,<3",
  "pgvector>=0.3,<1",
  "sentence-transformers>=3.3,<6",
  "torch>=2.5,<3",
  "transformers>=4.47,<6",
]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biodiversity_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

